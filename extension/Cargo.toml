[workspace]
members = ["crates/pxf-core", "crates/pxf-pg", "external-table", "fdw"]
default-members = ["crates/pxf-core"]
resolver = "2"

[workspace.package]
version = "3.0.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
futures-core = "0.3"
bytes = "1"
serde_json = "1.0"
pxf-core = { path = "crates/pxf-core" }
pxf-pg = { path = "crates/pxf-pg", default-features = false }
pgrx = { git = "https://github.com/cloudberry-contrib/pgrx", rev = "5077608658eb038aa0ebed9ec780b0f3f83233e7", default-features = false, features = ["cbdb"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(pgrx_embed)'] }

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"
codegen-units = 1
